<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Christmas Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Christmas Countdown</h1>
  <div class="countdown">
    <div class="unit"><div id="days">0</div>days</div>
    <div class="unit"><div id="hours">0</div>hours</div>
    <div class="unit"><div id="minutes">0</div>minutes</div>
    <div class="unit"><div id="seconds">0</div>seconds</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
